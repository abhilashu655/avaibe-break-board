<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaibe – Attendance Board</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#6b7280; --line:#e5e7eb;
    --green:#16a34a; --green-bg:#dcfce7; --amber:#d97706; --amber-bg:#fef3c7;
    --red:#dc2626; --red-bg:#fee2e2; --grey:#6b7280; --grey-bg:#f3f4f6; --blue:#2563eb; --blue-bg:#dbeafe;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
  h1{font-size:18px;margin:0}
  .sub{color:var(--muted);font-size:12px}
  .right{display:flex;align-items:center;gap:10px}
  button{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
  button.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}
  main{padding:20px 24px;max-width:1200px;margin:0 auto}
  .tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tile .n{font-size:26px;font-weight:600}
  .tile .l{color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--muted);font-weight:600;background:#fafafa;cursor:pointer;user-select:none}
  tr:last-child td{border-bottom:none}
  td.num{font-variant-numeric:tabular-nums}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .working{color:var(--green);background:var(--green-bg)}
  .break{color:var(--amber);background:var(--amber-bg)}
  .over{color:var(--red);background:var(--red-bg)}
  .late{color:var(--red);background:var(--red-bg)}
  .notin{color:var(--grey);background:var(--grey-bg)}
  .done{color:var(--blue);background:var(--blue-bg)}
  .timer{font-weight:600}
  .timer.warn{color:var(--red)}
  .muted{color:var(--muted)}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:12px;text-align:center}
  .err{background:var(--red-bg);color:var(--red);padding:10px 14px;border-radius:8px;margin-bottom:12px;white-space:pre-wrap}
  .legend{margin-top:12px;color:var(--muted);font-size:12px}
  h2.sec{font-size:15px;margin:28px 0 8px}
  .tile.ok{color:var(--green);font-weight:600}
  td{white-space:normal}
  nav.tabs{display:flex;gap:4px;margin-left:18px}
  nav.tabs a{padding:6px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600}
  nav.tabs a.on{background:#eef2ff;color:#4f46e5}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
  .bar .seg button.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
  .bar input[type=date]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
  .tiles.k8{grid-template-columns:repeat(4,1fr)}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 18px}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;height:280px}
  .chart h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
  .chart canvas{max-height:236px}
  td.link{color:#4f46e5;cursor:pointer;font-weight:600}
  .good{color:var(--green);font-weight:600} .bad{color:var(--red);font-weight:600} .warnc{color:var(--amber);font-weight:600}
  .note{background:#eef2ff;color:#3730a3;border-radius:8px;padding:8px 12px;font-size:12px;margin:10px 0}
  .flags span{margin-right:4px}
  @media (max-width:900px){.charts{grid-template-columns:1fr}.tiles.k8{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:800px){.tiles{grid-template-columns:repeat(2,1fr)} th:nth-child(5),td:nth-child(5){display:none}}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center">
    <div>
      <h1>Avaibe – Attendance Board</h1>
      <div class="sub" id="sub">Shifts time clock · Dubai time</div>
    </div>
    <nav class="tabs" id="tabs" hidden><a href="#live" id="tabLive">Live</a><a href="#analytics" id="tabAn">Analytics</a><a href="#hr" id="tabHr" hidden>HR corrections</a></nav>
  </div>
  <div class="right">
    <span class="sub" id="updated"></span>
    <button id="refreshBtn" hidden>Refresh</button>
    <button id="signOutBtn" hidden>Sign out</button>
  </div>
</header>
<main id="app">
  <div class="center" id="signin">
    <p>Sign in with your Avaibe Microsoft account to see live clock-in and break status.</p>
    <button class="primary" id="signInBtn">Sign in with Microsoft</button>
    <p class="sub">Only schedule owners (managers) can see the team's time cards.</p>
  </div>
</main>
<main id="an" hidden></main>
<main id="hr" hidden></main>

<script>
/* ===== CONFIG ===== */
const CONFIG = {
  clientId: "55833e79-a769-4d81-897d-93824a9402f0",
  tenantId: "41385911-2567-4873-bcf2-e28193046199",
  teamId:   "55a0dee6-69f7-447d-8a27-ae00decfad30",   // Avaibe – Attendance
  timeZone: "Asia/Dubai",
  breakLimitMin: 60,       // daily break allowance
  lateGraceMin: 15,        // flag as late if not clocked in this long after shift start
  refreshSec: 30,
  auditDays: 30,           // how far back to check for edited / off-day entries
  manualGapMin: 15,        // entry created this long after its clock-in time = added by hand
  excludeUserEmails: ["abhilash@avaibe.com", "director@avaibe.com", "sujit@avaibe.com"], // managers, not tracked
  hrEmails: ["sujit@avaibe.com", "abhilash@avaibe.com", "director@avaibe.com"]          // can enter corrections
};
const SCOPES = ["Schedule.Read.All", "User.ReadBasic.All"];
const WRITE_SCOPES = ["Schedule.ReadWrite.All"];
const GRAPH = "https://graph.microsoft.com/v1.0";

/* ===== AUTH ===== */
const inIframe = window.self !== window.top;
</script>
<script>
const msalLib = window.msal;
const pca = new msalLib.PublicClientApplication({
  auth: {
    clientId: CONFIG.clientId,
    authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`,
    redirectUri: window.location.origin + window.location.pathname
  },
  cache: { cacheLocation: "localStorage" }
});

async function getToken(scopes = SCOPES) {
  const account = pca.getActiveAccount() || pca.getAllAccounts()[0];
  if (!account) throw new Error("not-signed-in");
  pca.setActiveAccount(account);
  try {
    return (await pca.acquireTokenSilent({ scopes, account })).accessToken;
  } catch (e) {
    if (e instanceof msalLib.InteractionRequiredAuthError) {
      try { return (await pca.acquireTokenPopup({ scopes, account })).accessToken; }
      catch (e2) { if (!inIframe) await pca.acquireTokenRedirect({ scopes, account }); throw e2; }
    }
    throw e;
  }
}

async function signIn() {
  if (inIframe) {
    const r = await pca.loginPopup({ scopes: SCOPES });
    pca.setActiveAccount(r.account);
    start();
  } else {
    await pca.loginRedirect({ scopes: SCOPES });
  }
}

/* ===== GRAPH ===== */
async function graph(path, token) {
  const url = path.startsWith("http") ? path : GRAPH + path;
  const res = await fetch(url, { headers: { Authorization: "Bearer " + token } });
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try { const j = await res.json(); msg += " – " + (j.error?.message || ""); } catch {}
    const err = new Error(msg); err.status = res.status; throw err;
  }
  return res.json();
}
async function graphSend(method, path, body, token) {
  const res = await fetch(GRAPH + path, { method, headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) {
    let msg = res.status + " " + res.statusText;
    try { const j = await res.json(); msg += " – " + (j.error?.message || ""); } catch {}
    const err = new Error(msg); err.status = res.status; throw err;
  }
  return res.status === 204 ? null : res.json().catch(() => null);
}
async function graphAll(path, token, maxPages = 50) {
  let out = [], next = path, pages = 0;
  while (next && pages < maxPages) {
    const j = await graph(next, token);
    out = out.concat(j.value || []);
    next = j["@odata.nextLink"]; pages++;
  }
  return out;
}

/* ===== TIME HELPERS ===== */
const fmtTime = d => d ? new Intl.DateTimeFormat("en-GB",{timeZone:CONFIG.timeZone,hour:"2-digit",minute:"2-digit"}).format(d) : "—";
const dubaiDateKey = d => new Intl.DateTimeFormat("en-CA",{timeZone:CONFIG.timeZone,year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
function dubaiMidnightUtc(now = new Date()) {
  // Dubai is UTC+4 with no DST
  const key = dubaiDateKey(now); // YYYY-MM-DD
  return new Date(key + "T00:00:00+04:00");
}
function dur(ms) {
  if (ms == null || ms < 0) return "—";
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : String(m)) + ":" + String(sec).padStart(2,"0");
}
const mins = ms => Math.round(ms/60000);

/* ===== DATA ===== */
let state = { rows: [], fetchedAt: null, sortKey: "status", users: {} };

async function loadData() {
  const token = await getToken();
  const dayStart = dubaiMidnightUtc();
  const dayEnd = new Date(dayStart.getTime() + 24*3600*1000);

  // Time cards for the audit window (try server-side filter, fall back to client-side)
  const auditStart = new Date(dayStart.getTime() - CONFIG.auditDays*24*3600*1000);
  let allCards;
  try {
    allCards = await graphAll(`/teams/${CONFIG.teamId}/schedule/timeCards?$filter=clockInEvent/dateTime ge ${auditStart.toISOString()}&$top=200`, token);
  } catch (e) {
    if (e.status !== 400) throw e;
    allCards = (await graphAll(`/teams/${CONFIG.teamId}/schedule/timeCards?$top=200`, token, 100))
      .filter(c => c.clockInEvent && new Date(c.clockInEvent.dateTime) >= auditStart);
  }
  allCards = allCards.filter(c => c.clockInEvent?.dateTime);
  const cards = allCards.filter(c => {
    const t = new Date(c.clockInEvent.dateTime);
    return t >= dayStart && t < dayEnd;
  });

  // Today's shifts (roster)
  let shifts = [];
  try {
    shifts = await graphAll(`/teams/${CONFIG.teamId}/schedule/shifts?$filter=sharedShift/startDateTime ge ${dayStart.toISOString()} and sharedShift/endDateTime le ${dayEnd.toISOString()}`, token);
  } catch (e) { console.warn("shifts", e); }

  // Team members via schedule owners/members: collect all user ids we know
  const ids = new Set([...cards.map(c => c.userId), ...shifts.map(s => s.userId)].filter(Boolean));
  const allIds = new Set([...ids, ...allCards.map(c => c.userId)].filter(Boolean));
  const missing = [...allIds].filter(id => !state.users[id]);
  for (let i = 0; i < missing.length; i += 15) {
    const chunk = missing.slice(i, i+15).map(id => `'${id}'`).join(",");
    try {
      const us = await graphAll(`/users?$filter=id in (${chunk})&$select=id,displayName,mail,userPrincipalName`, token);
      us.forEach(u => state.users[u.id] = u);
    } catch (e) { console.warn("users", e); }
  }

  const excluded = new Set(CONFIG.excludeUserEmails.map(x => x.toLowerCase()));
  const byUser = {};
  ids.forEach(id => byUser[id] = { id, cards: [], shift: null });
  cards.forEach(c => byUser[c.userId]?.cards.push(c));
  shifts.forEach(s => { if (byUser[s.userId]) byUser[s.userId].shift = s; });

  const rows = [];
  for (const u of Object.values(byUser)) {
    const info = state.users[u.id] || {};
    const email = (info.mail || info.userPrincipalName || "").toLowerCase();
    if (excluded.has(email)) continue;
    u.cards.sort((a,b) => new Date(a.clockInEvent.dateTime) - new Date(b.clockInEvent.dateTime));
    const latest = u.cards[u.cards.length - 1];
    const firstIn = u.cards[0] ? new Date(u.cards[0].clockInEvent.dateTime) : null;
    // breaks across all of today's cards
    const breaks = u.cards.flatMap(c => c.breaks || []).map(b => ({
      start: b.start?.dateTime ? new Date(b.start.dateTime) : null,
      end: b.end?.dateTime ? new Date(b.end.dateTime) : null
    })).filter(b => b.start);
    const openBreak = latest && latest.state === "onBreak"
      ? breaks.filter(b => !b.end).sort((a,b) => b.start - a.start)[0] || null : null;
    const closedBreakMs = breaks.filter(b => b.end).reduce((t,b) => t + (b.end - b.start), 0);
    const shiftStart = u.shift?.sharedShift?.startDateTime ? new Date(u.shift.sharedShift.startDateTime) : null;
    const shiftEnd = u.shift?.sharedShift?.endDateTime ? new Date(u.shift.sharedShift.endDateTime) : null;
    const clockOut = latest?.clockOutEvent?.dateTime ? new Date(latest.clockOutEvent.dateTime) : null;
    let status;
    if (!latest) status = "notin";
    else if (latest.state === "onBreak") status = "break";
    else if (latest.state === "clockedOut") status = "done";
    else status = "working";
    rows.push({
      id: u.id, name: info.displayName || info.mail || u.id.slice(0,8),
      status, firstIn, clockOut, openBreak, closedBreakMs,
      breakCount: breaks.length, shiftStart, shiftEnd
    });
  }
  state.rows = rows;
  state.audit = auditCards(allCards, excluded);
  state.fetchedAt = new Date();
}

/* ===== AUDIT: edited / back-dated / future-dated entries ===== */
const ms = x => x ? new Date(x).getTime() : null;
const differs = (a, b) => a != null && b != null && Math.abs(a - b) > 60000; // > 1 min
function auditCards(allCards, excluded) {
  const now = Date.now(), out = [];
  for (const c of allCards) {
    const info = state.users[c.userId] || {};
    const email = (info.mail || info.userPrincipalName || "").toLowerCase();
    if (excluded.has(email)) continue;
    const name = info.displayName || info.mail || (c.userId || "").slice(0,8);
    const inT = ms(c.clockInEvent?.dateTime), outT = ms(c.clockOutEvent?.dateTime);
    const created = ms(c.createdDateTime);
    const issues = [];
    const o = c.originalEntry;
    const creator = c.createdBy?.user, modifier = c.lastModifiedBy?.user;
    const hrCreated = !!(creator?.id && creator.id !== c.userId);
    const hrModified = !!(modifier?.id && modifier.id !== c.userId);
    const firstIn = ms(o?.clockInEvent?.dateTime) || inT;   // clock-in as first recorded
    // Entry for a different day than the day it was created, or in the future
    if (created && firstIn && dubaiDateKey(new Date(created)) !== dubaiDateKey(new Date(firstIn)))
      issues.push({ kind: firstIn < created ? "Back-dated" : "Future-dated",
        detail: `Entry for ${fmtDay(firstIn)} was created on ${fmtDay(created)} ${fmtTime(new Date(created))}` });
    else if (inT > now + 5*60000)
      issues.push({ kind: "Future-dated", detail: `Clock-in set to ${fmtDay(inT)} ${fmtTime(new Date(inT))}` });
    // Added by hand (created long after the clock-in it claims)
    else if (created && firstIn && created - firstIn > CONFIG.manualGapMin*60000)
      issues.push({ kind: "Added manually", detail: `Clock-in ${fmtTime(new Date(firstIn))} entered at ${fmtTime(new Date(created))}` });
    // Edited after the fact (compare with original entry)
    if (o) {
      const oIn = ms(o.clockInEvent?.dateTime), oOut = ms(o.clockOutEvent?.dateTime);
      if (differs(inT, oIn)) issues.push({ kind: "Edited", detail: `Clock-in ${fmtTime(new Date(oIn))} → ${fmtTime(new Date(inT))}` });
      if (differs(outT, oOut)) issues.push({ kind: "Edited", detail: `Clock-out ${fmtTime(new Date(oOut))} → ${fmtTime(new Date(outT))}` });
      const nb = c.breaks || [], ob = o.breaks || [];
      if (c.state === "clockedOut" && o.breaks && nb.length !== ob.length)
        issues.push({ kind: "Edited", detail: `Breaks ${ob.length} → ${nb.length}` });
      const obById = Object.fromEntries(ob.map(b => [b.breakId, b]));
      for (const b of nb) {
        const ob1 = obById[b.breakId]; if (!ob1) continue;
        if (differs(ms(b.start?.dateTime), ms(ob1.start?.dateTime)) || differs(ms(b.end?.dateTime), ms(ob1.end?.dateTime)))
          issues.push({ kind: "Edited", detail: `Break ${fmtTime(new Date(ms(ob1.start?.dateTime)))}–${ob1.end?.dateTime ? fmtTime(new Date(ms(ob1.end.dateTime))) : "…"} → ${fmtTime(new Date(ms(b.start?.dateTime)))}–${b.end?.dateTime ? fmtTime(new Date(ms(b.end.dateTime))) : "…"}` });
      }
    }
    const reason = c.clockInEvent?.notes?.content || c.notes?.content || "";
    for (const i of issues) {
      const hr = i.kind === "Edited" ? hrModified : hrCreated;
      i.by = hr ? "hr" : "self";
      if (hr) { const who = (i.kind === "Edited" ? modifier : creator)?.displayName || "HR"; i.detail += ` · by ${who}${reason ? ` – “${reason}”` : ""}`; }
    }
    if (issues.length) out.push({ name, day: inT, changed: ms(c.lastModifiedDateTime) || created, issues });
  }
  return out.sort((a, b) => (b.changed||0) - (a.changed||0));
}
const fmtDay = t => new Intl.DateTimeFormat("en-GB",{timeZone:CONFIG.timeZone,weekday:"short",day:"2-digit",month:"short"}).format(new Date(t));

/* ===== RENDER ===== */
const ORDER = { over:0, late:1, break:2, working:3, notin:4, done:5 };
function derive(r, now) {
  const breakTotal = r.closedBreakMs + (r.openBreak ? now - r.openBreak.start : 0);
  let status = r.status;
  if (status === "break" && breakTotal > CONFIG.breakLimitMin*60000) status = "over";
  if (status === "notin" && r.shiftStart && now - r.shiftStart > CONFIG.lateGraceMin*60000 && (!r.shiftEnd || now < r.shiftEnd)) status = "late";
  return { ...r, breakTotal, dstatus: status, current: r.openBreak ? now - r.openBreak.start : null };
}
const LABEL = { working:"Working", break:"On break", over:"Over break limit", late:"Late – not clocked in", notin:"Not clocked in", done:"Clocked out" };

function render() {
  const app = document.getElementById("app");
  const now = new Date();
  const rows = state.rows.map(r => derive(r, now));
  const count = k => rows.filter(r => k.includes(r.dstatus)).length;
  const k = state.sortKey;
  rows.sort((a,b) => k === "name" ? a.name.localeCompare(b.name)
    : k === "breakTotal" ? b.breakTotal - a.breakTotal
    : (ORDER[a.dstatus]-ORDER[b.dstatus]) || ((b.current||0)-(a.current||0)) || a.name.localeCompare(b.name));
  app.innerHTML = `
    ${state.error ? `<div class="err">${state.error}</div>` : ""}
    <div class="tiles">
      <div class="tile"><div class="n">${count(["working"])}</div><div class="l">Working</div></div>
      <div class="tile"><div class="n">${count(["break","over"])}</div><div class="l">On break now</div></div>
      <div class="tile"><div class="n" style="color:var(--red)">${count(["over","late"])}</div><div class="l">Need attention</div></div>
      <div class="tile"><div class="n">${count(["notin","late"])}</div><div class="l">Not clocked in</div></div>
      <div class="tile"><div class="n">${count(["done"])}</div><div class="l">Clocked out</div></div>
    </div>
    <table>
      <thead><tr>
        <th data-k="name">Staff</th><th data-k="status">Status</th><th>Clocked in</th>
        <th>Break started</th><th>On current break</th><th data-k="breakTotal">Break total today</th><th>Breaks</th>
      </tr></thead>
      <tbody>
      ${rows.length ? rows.map(r => `
        <tr>
          <td>${esc(r.name)}</td>
          <td><span class="pill ${r.dstatus}">${LABEL[r.dstatus]}</span></td>
          <td class="num">${fmtTime(r.firstIn)}${r.dstatus==="done" ? ` <span class="muted">→ ${fmtTime(r.clockOut)}</span>` : ""}</td>
          <td class="num">${r.openBreak ? fmtTime(r.openBreak.start) : "—"}</td>
          <td class="num timer ${r.dstatus==="over"?"warn":""}">${r.current!=null ? dur(r.current) : "—"}</td>
          <td class="num ${r.breakTotal > CONFIG.breakLimitMin*60000 ? "timer warn":""}">${r.breakTotal ? mins(r.breakTotal) + " / " + CONFIG.breakLimitMin + " min" : "—"}</td>
          <td class="num">${r.breakCount || "—"}</td>
        </tr>`).join("") : `<tr><td colspan="7" class="muted">No shifts or clock-ins today.</td></tr>`}
      </tbody>
    </table>
    <div class="legend">Refreshes every ${CONFIG.refreshSec}s · timers tick live · "Late" = not clocked in ${CONFIG.lateGraceMin} min after shift start · break limit ${CONFIG.breakLimitMin} min/day (paid)</div>
    <h2 class="sec">Irregular entries <span class="muted">· last ${CONFIG.auditDays} days</span></h2>
    <p class="sub" style="margin:-6px 0 10px"><b>Self:</b> staff changed their own time sheet (not allowed – they must request HR). <b>HR correction:</b> entered by HR from an approved Missed clock-in request.</p>
    ${(state.audit||[]).length ? `<table>
      <thead><tr><th>Staff</th><th>Shift day</th><th>Issue</th><th>Details</th><th>Last changed</th></tr></thead>
      <tbody>${state.audit.map(a => a.issues.map((i, n) => `
        <tr>
          <td>${n ? "" : esc(a.name)}</td>
          <td class="num">${n ? "" : fmtDay(a.day)}</td>
          <td><span class="pill ${i.by==="hr" ? "done" : i.kind==="Edited" ? "break" : "over"}">${i.by==="hr" ? "HR correction" : "Self: " + i.kind}</span></td>
          <td>${esc(i.detail)}</td>
          <td class="num">${n || !a.changed ? "" : fmtDay(a.changed) + " " + fmtTime(new Date(a.changed))}</td>
        </tr>`).join("")).join("")}</tbody></table>`
      : `<div class="tile ok">✓ No edited, back-dated or future-dated entries.</div>`}`;
  app.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => { state.sortKey = th.dataset.k; render(); });
  document.getElementById("updated").textContent = state.fetchedAt ? "Updated " + fmtTime(state.fetchedAt) : "";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== SHARED FETCH ===== */
const excludedSet = new Set(CONFIG.excludeUserEmails.map(x => x.toLowerCase()));
const isExcluded = id => { const u = state.users[id] || {}; return excludedSet.has((u.mail || u.userPrincipalName || "").toLowerCase()); };
const nameOf = id => { const u = state.users[id] || {}; return u.displayName || u.mail || (id || "").slice(0,8); };
async function fetchCards(token, from, to) {
  let cards;
  try {
    cards = await graphAll(`/teams/${CONFIG.teamId}/schedule/timeCards?$filter=clockInEvent/dateTime ge ${from.toISOString()}&$top=200`, token, 200);
  } catch (e) {
    if (e.status !== 400) throw e;
    cards = await graphAll(`/teams/${CONFIG.teamId}/schedule/timeCards?$top=200`, token, 200);
  }
  return cards.filter(c => c.clockInEvent?.dateTime && new Date(c.clockInEvent.dateTime) >= from && new Date(c.clockInEvent.dateTime) < to);
}
async function fetchShifts(token, from, to) {
  try {
    return await graphAll(`/teams/${CONFIG.teamId}/schedule/shifts?$filter=sharedShift/startDateTime ge ${from.toISOString()} and sharedShift/endDateTime le ${to.toISOString()}`, token, 200);
  } catch (e) { console.warn("shifts", e); return []; }
}
async function ensureUsers(token, ids) {
  const missing = [...new Set(ids)].filter(id => id && !state.users[id]);
  for (let i = 0; i < missing.length; i += 15) {
    const chunk = missing.slice(i, i+15).map(id => `'${id}'`).join(",");
    try {
      const us = await graphAll(`/users?$filter=id in (${chunk})&$select=id,displayName,mail,userPrincipalName`, token);
      us.forEach(u => state.users[u.id] = u);
    } catch (e) { console.warn("users", e); }
  }
}

/* ===== ANALYTICS ===== */
const DAY = 864e5;
const keyToDate = k => new Date(k + "T00:00:00+04:00");
const addDays = (k, n) => dubaiDateKey(new Date(keyToDate(k).getTime() + n*DAY + 12*3600e3));
const dow = k => new Date(k + "T12:00:00Z").getUTCDay();            // 0=Sun
const mondayOf = k => addDays(k, -((dow(k) + 6) % 7));
const minOfDay = t => { const [h, m] = fmtTime(new Date(t)).split(":").map(Number); return h*60 + m; };
const hhmm = m => m == null || isNaN(m) ? "—" : String(Math.floor(m/60)).padStart(2,"0") + ":" + String(Math.round(m%60)).padStart(2,"0");
const pct = (a, b) => b ? Math.round(100*a/b) : null;
const fmtKey = (k, opts) => new Intl.DateTimeFormat("en-GB", { timeZone: "UTC", ...opts }).format(new Date(k + "T12:00:00Z"));
const hrs = msv => msv == null ? "—" : (msv/3600e3).toFixed(1) + " h";
const mn = msv => msv == null ? "—" : Math.round(msv/60000) + " min";

const an = { preset: "this-week", from: null, to: null, data: null, sel: null, sort: "name", loading: false, error: null, charts: [] };
function presetRange(p) {
  const t = dubaiDateKey(new Date());
  if (p === "this-week")  return [mondayOf(t), t];
  if (p === "last-week")  { const m = addDays(mondayOf(t), -7); return [m, addDays(m, 6)]; }
  if (p === "this-month") return [t.slice(0,8) + "01", t];
  if (p === "last-month") { const first = t.slice(0,8) + "01", lastPrev = addDays(first, -1); return [lastPrev.slice(0,8) + "01", lastPrev]; }
  if (p === "last-30")    return [addDays(t, -29), t];
  return [an.from, an.to];
}

async function loadAnalytics() {
  if (an.preset !== "custom") [an.from, an.to] = presetRange(an.preset);
  if (!an.from || !an.to || an.from > an.to) { an.error = "Pick a valid date range."; return renderAnalytics(); }
  an.loading = true; an.error = null; renderAnalytics();
  try {
    const token = await getToken();
    const from = keyToDate(an.from), to = keyToDate(addDays(an.to, 1));
    const [cards, shifts] = await Promise.all([fetchCards(token, from, to), fetchShifts(token, from, to)]);
    await ensureUsers(token, [...cards.map(c => c.userId), ...shifts.map(s => s.userId)]);
    an.data = computeAnalytics(cards, shifts, an.from, an.to);
  } catch (e) {
    if (e.message === "not-signed-in") return showSignIn();
    an.error = "Couldn't load analytics: " + e.message;
  }
  an.loading = false; renderAnalytics();
}

function computeAnalytics(cards, shifts, fromKey, toKey, nowMs = Date.now()) {
  const todayKey = dubaiDateKey(new Date(nowMs));
  const grace = CONFIG.lateGraceMin*60000, limit = CONFIG.breakLimitMin*60000;
  const days = []; for (let k = fromKey; k <= toKey && k <= todayKey; k = addDays(k, 1)) days.push(k);
  const daySet = new Set(days);
  const per = {};
  const slot = (u, k) => ((per[u] ??= {})[k] ??= { shift: null, cards: [] });
  for (const s of shifts) {
    if (!s.userId || !s.sharedShift?.startDateTime) continue;
    const st = ms(s.sharedShift.startDateTime), en = ms(s.sharedShift.endDateTime);
    slot(s.userId, dubaiDateKey(new Date(st))).shift = { start: st, end: en };
  }
  for (const c of cards) slot(c.userId, dubaiDateKey(new Date(ms(c.clockInEvent.dateTime)))).cards.push(c);

  const employees = [], dailyMap = Object.fromEntries(days.map(k => [k, { k, sched: 0, onTime: 0, late: 0, absent: 0, brk: [], extra: 0 }]));
  for (const uid of Object.keys(per)) {
    if (isExcluded(uid)) continue;
    const e = { id: uid, name: nameOf(uid), sched: 0, present: 0, extra: 0, absent: 0, late: 0, early: 0, noOut: 0, overBreak: 0,
                workedMs: 0, workedDays: 0, hoursDays: 0, brkMs: 0, inMins: [], irregular: 0, days: [] };
    for (const k of Object.keys(per[uid]).sort()) {
      if (!daySet.has(k)) continue;
      const { shift: s, cards: cs } = per[uid][k];
      cs.sort((a, b) => ms(a.clockInEvent.dateTime) - ms(b.clockInEvent.dateTime));
      const isToday = k === todayKey;
      const firstIn = cs.length ? ms(cs[0].clockInEvent.dateTime) : null;
      const open = cs.some(c => c.state !== "clockedOut");
      const outs = cs.map(c => ms(c.clockOutEvent?.dateTime)).filter(Boolean);
      const lastOut = outs.length ? Math.max(...outs) : null;
      let worked = 0, brk = 0, brkCount = 0;
      const complete = isToday || cs.every(c => c.clockOutEvent?.dateTime);
      for (const c of cs) {
        const i = ms(c.clockInEvent.dateTime), o = ms(c.clockOutEvent?.dateTime) ?? (isToday ? nowMs : null);
        if (o) worked += o - i;
        for (const b of c.breaks || []) {
          const bs = ms(b.start?.dateTime); if (!bs) continue;
          const be = ms(b.end?.dateTime) ?? (isToday && c.state === "onBreak" ? nowMs : null);
          brkCount++; if (be) brk += be - bs;
        }
      }
      const elapsed = s && (k < todayKey || cs.length || nowMs > s.end);
      const late = !!(s && firstIn && firstIn > s.start + grace);
      const early = !!(s && lastOut && !open && lastOut < s.end - grace);
      const noOut = open && k < todayKey;
      const absent = !!(s && !cs.length && (k < todayKey || nowMs > s.end));
      const over = brk > limit;
      const irr = cs.length ? auditCards(cs, excludedSet).reduce((t, a) => t + a.issues.filter(i => i.by === "self").length, 0) : 0;
      if (elapsed) e.sched++;
      if (s && cs.length) e.present++;
      if (!s && cs.length) e.extra++;
      if (absent) e.absent++;
      if (late) e.late++;
      if (early) e.early++;
      if (noOut) e.noOut++;
      if (over) e.overBreak++;
      if (cs.length) { e.workedDays++; e.brkMs += brk; e.inMins.push(minOfDay(firstIn)); }
      if (cs.length && complete) { e.hoursDays++; e.workedMs += worked; }
      e.irregular += irr;
      e.days.push({ k, shift: s, firstIn, lastOut, open, worked: cs.length && complete ? worked : null, brk: cs.length ? brk : null, brkCount, late, early, noOut, absent, over, irr, isToday });
      const d = dailyMap[k];
      if (elapsed) d.sched++;
      if (s && cs.length) (late ? d.late++ : d.onTime++);
      if (!s && cs.length) d.extra++;
      if (absent) d.absent++;
      if (cs.length) d.brk.push(brk);
    }
    if (!e.days.length) continue;
    e.attendance = pct(e.present, e.sched);
    e.punctuality = pct(e.present - e.late, e.present);
    e.avgIn = e.inMins.length ? e.inMins.reduce((a, b) => a + b, 0) / e.inMins.length : null;
    e.avgWorked = e.hoursDays ? e.workedMs / e.hoursDays : null;
    e.avgBrk = e.workedDays ? e.brkMs / e.workedDays : null;
    employees.push(e);
  }
  const daily = days.map(k => { const d = dailyMap[k]; return { ...d, avgBrk: d.brk.length ? d.brk.reduce((a, b) => a + b, 0) / d.brk.length : null }; });
  const sum = f => employees.reduce((t, e) => t + (e[f] || 0), 0);
  const team = {
    staff: employees.length, sched: sum("sched"), present: sum("present"), late: sum("late"), absent: sum("absent"),
    early: sum("early"), noOut: sum("noOut"), overBreak: sum("overBreak"), irregular: sum("irregular"),
    workedDays: sum("workedDays"), hoursDays: sum("hoursDays"), workedMs: sum("workedMs"), brkMs: sum("brkMs")
  };
  team.attendance = pct(team.present, team.sched);
  team.punctuality = pct(team.present - team.late, team.present);
  team.avgWorked = team.hoursDays ? team.workedMs / team.hoursDays : null;
  team.avgBrk = team.workedDays ? team.brkMs / team.workedDays : null;
  return { employees, daily, team, days };
}

const tone = (v, good, bad, higherIsBetter = true) => v == null ? "" :
  (higherIsBetter ? (v >= good ? "good" : v < bad ? "bad" : "warnc") : (v <= good ? "good" : v > bad ? "bad" : "warnc"));
const pctTxt = v => v == null ? "—" : v + "%";

    <div class="tiles k8">

      <div class="tile"><div class="n ${tone(t.punctuality,90,75)}">${pctTxt(t.punctuality)}</div><div class="l">On time (≤ ${CONFIG.lateGraceMin} min after start)</div></div>
      <div class="tile"><div class="n">${hrs(t.avgWorked)}</div><div class="l">Avg time on clock per day</div></div>
      <div class="tile"><div class="n ${tone(t.avgBrk==null?null:t.avgBrk/60000, CONFIG.breakLimitMin*0.8, CONFIG.breakLimitMin, false)}">${mn(t.avgBrk)}</div><div class="l">Avg break per day (limit ${CONFIG.breakLimitMin})</div></div>

      <div class="tile"><div class="n ${t.overBreak?"bad":""}">${t.overBreak}</div><div class="l">Days over break limit</div></div>

    </div>

  el.querySelectorAll("th[data-s]").forEach(th => th.onclick = () => { an.sort = th.dataset.s; renderAnalytics(); });
  el.querySelectorAll("td[data-u]").forEach(td => td.onclick = () => { an.sel = td.dataset.u; renderAnalytics(); const cz = document.getElementById("closeSel"); if (cz && cz.scrollIntoView) cz.scrollIntoView({behavior:"smooth", block:"center"}); });
  const cs = el.querySelector("#closeSel"); if (cs) cs.onclick = () => { an.sel = null; renderAnalytics(); };
  const cb = el.querySelector("#csvBtn"); if (cb) cb.onclick = exportCsv;
  if (d) drawCharts(d);
}

function drawCharts(d) {
  an.charts.forEach(c => c.destroy()); an.charts = [];
  if (!window.Chart) return;
  const labels = d.daily.map(x => fmtKey(x.k, { weekday: "short", day: "2-digit" }));
  an.charts.push(new Chart(document.getElementById("chAtt"), {
    type: "bar",
    data: { labels, datasets: [
      { label: "On time", data: d.daily.map(x => x.onTime), backgroundColor: "#16a34a", stack: "a" },
      { label: "Late", data: d.daily.map(x => x.late), backgroundColor: "#d97706", stack: "a" },
      { label: "Absent", data: d.daily.map(x => x.absent), backgroundColor: "#dc2626", stack: "a" }
    ]},
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } },
      scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true, ticks: { precision: 0 } } } }
  }));
  an.charts.push(new Chart(document.getElementById("chBrk"), {
    type: "line",
    data: { labels, datasets: [
      { label: "Avg break (min)", data: d.daily.map(x => x.avgBrk == null ? null : Math.round(x.avgBrk/60000)), borderColor: "#4f46e5", backgroundColor: "#4f46e5", tension: .25, spanGaps: true },
      { label: `Limit (${CONFIG.breakLimitMin})`, data: d.daily.map(() => CONFIG.breakLimitMin), borderColor: "#dc2626", borderDash: [6, 4], pointRadius: 0 }
    ]},
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom" } },
      scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
  }));
}

function exportCsv() {
  const d = an.data; if (!d) return;
  const head = ["Staff","Scheduled days","Present","Attendance %","On time %","Late","Absent","Avg clock-in","Avg hours on clock/day","Avg break min/day","Over-break days","Left early","No clock-out","Self-edits"];
  const rows = d.employees.map(e => [e.name, e.sched, e.present, e.attendance ?? "", e.punctuality ?? "", e.late, e.absent, hhmm(e.avgIn),
    e.avgWorked == null ? "" : (e.avgWorked/3600e3).toFixed(2), e.avgBrk == null ? "" : Math.round(e.avgBrk/60000), e.overBreak, e.early, e.noOut, e.irregular]);
  const csv = [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `avaibe-attendance_${an.from}_to_${an.to}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ===== HR CORRECTIONS ===== */
const hr = { staff: null, uid: "", day: "", existing: null, msg: null, err: null, busy: false };
const me = () => pca.getActiveAccount() || {};
const isHR = () => CONFIG.hrEmails.includes((me().username || "").toLowerCase());
const dtISO = (day, hm) => new Date(`${day}T${hm}:00+04:00`).toISOString();

async function loadHRStaff() {
  try {
    const token = await getToken(), t = dubaiDateKey(new Date());
    const shifts = await fetchShifts(token, keyToDate(addDays(t, -35)), keyToDate(addDays(t, 15)));
    await ensureUsers(token, shifts.map(s => s.userId));
    hr.staff = [...new Set(shifts.map(s => s.userId))].filter(id => id && !isExcluded(id))
      .map(id => ({ id, name: nameOf(id) })).sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) { hr.err = "Couldn't load staff list: " + e.message; hr.staff = []; }
  renderHR();
}
async function loadExisting(keepMsg = false) {
  hr.existing = null; hr.err = null; if (!keepMsg) hr.msg = null;
  if (!hr.uid || !hr.day) return renderHR();
  hr.busy = true; renderHR();
  try {
    const token = await getToken();
    const cards = await fetchCards(token, keyToDate(hr.day), keyToDate(addDays(hr.day, 1)));
    hr.existing = cards.filter(c => c.userId === hr.uid).sort((a, b) => ms(a.clockInEvent.dateTime) - ms(b.clockInEvent.dateTime));
  } catch (e) { hr.err = "Couldn't look up existing entries: " + e.message; }
  hr.busy = false; renderHR();
}

async function saveCorrection(f) {
  hr.msg = null; hr.err = null;
  const today = dubaiDateKey(new Date()), now = Date.now();
  const g = n => f.elements.namedItem(n);
  const inT = g("inT").value, outT = g("outT").value, bS = g("bS").value, bE = g("bE").value, reason = g("reason").value.trim();
  const target = hr.existing?.length ? hr.existing[Number(g("which")?.value || 0)] : null;
  const errs = [];
  if (!hr.uid) errs.push("Choose an employee.");
  if (!hr.day || hr.day > today) errs.push("Date must be today or earlier.");
  if (!inT) errs.push("Clock-in time is required.");
  if (inT && ms(dtISO(hr.day, inT)) > now) errs.push("Clock-in can't be in the future.");
  if (outT && inT && outT <= inT) errs.push("Clock-out must be after clock-in.");
  if (outT && ms(dtISO(hr.day, outT)) > now) errs.push("Clock-out can't be in the future.");
  if (!outT && hr.day < today) errs.push("For a past day, enter the clock-out time too.");
  if ((bS || bE) && !(bS && bE && bE > bS)) errs.push("Break needs a start and a later end, or leave both empty.");
  if (reason.length < 5) errs.push("Reason is required (e.g. the approval request and what happened).");
  if (errs.length) { hr.err = errs.join(" "); return renderHR(); }

  hr.busy = true; renderHR();
  try {
    const token = await getToken(WRITE_SCOPES);
    const note = { contentType: "text", content: `HR correction by ${me().name || me().username}: ${reason}` };
    const path = `/teams/${CONFIG.teamId}/schedule/timeCards`;
    if (target) {
      const body = {
        userId: target.userId,
        state: outT ? "clockedOut" : target.state,
        clockInEvent: { dateTime: dtISO(hr.day, inT), isAtApprovedLocation: target.clockInEvent?.isAtApprovedLocation ?? null, notes: note },
        clockOutEvent: outT ? { dateTime: dtISO(hr.day, outT), isAtApprovedLocation: null, notes: null } : (target.clockOutEvent || null),
        breaks: (target.breaks || []).concat(bS ? [{ start: { dateTime: dtISO(hr.day, bS) }, end: { dateTime: dtISO(hr.day, bE) } }] : []),
        notes: note
      };
      await graphSend("PUT", `${path}/${target.id}`, body, token);
    } else {
      const body = { userId: hr.uid, clockInEvent: { dateTime: dtISO(hr.day, inT), isAtApprovedLocation: true, notes: note } };
      if (outT) body.clockOutEvent = { dateTime: dtISO(hr.day, outT), isAtApprovedLocation: true };
      if (bS) body.breaks = [{ start: { dateTime: dtISO(hr.day, bS) }, end: { dateTime: dtISO(hr.day, bE) } }];
      await graphSend("POST", path, body, token);
    }
    hr.msg = `Saved for ${nameOf(hr.uid)} on ${fmtKey(hr.day, { weekday: "short", day: "2-digit", month: "short" })}. It now shows as an HR correction on the board.`;
    await loadExisting(true); refresh(); an.data = null;
  } catch (e) {
    hr.err = "Couldn't save: " + e.message + (e.status === 403 ? " – make sure you are an owner of 'Avaibe – Attendance'." : "");
  }
  hr.busy = false; renderHR();
}

function renderHR() {
  const el = document.getElementById("hr");
  if (!isHR()) { el.innerHTML = '<div class="center"><p class="muted">HR corrections are only available to HR.</p></div>'; return; }
  if (!hr.staff) { el.innerHTML = '<div class="center"><p class="muted">Loading staff…</p></div>'; loadHRStaff(); return; }
  const ex = hr.existing, first = ex?.[0];
  const t = x => x ? fmtTime(new Date(ms(x))) : "";
  const pre = first ? { in: t(first.clockInEvent?.dateTime), out: t(first.clockOutEvent?.dateTime) } : { in: "", out: "" };
  const recent = (state.audit || []).filter(a => a.issues.some(i => i.by === "hr")).slice(0, 10);
  el.innerHTML = `
    <h2 class="sec" style="margin-top:0">HR corrections</h2>
    <div class="note">Only use this for an <b>approved Missed clock-in request</b> from Teams Approvals. Every correction is saved under your name with the reason, and shows on the board as an HR correction. Staff must not edit their own time sheets.</div>
    ${hr.err ? `<div class="err">${esc(hr.err)}</div>` : ""}${hr.msg ? `<div class="tile ok" style="margin-bottom:12px">✓ ${esc(hr.msg)}</div>` : ""}
    <form id="hrForm" class="tile" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end">
      <label>Employee<br><select name="uid" style="width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px">
        <option value="">Choose…</option>${hr.staff.map(s => `<option value="${s.id}" ${s.id === hr.uid ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select></label>
      <label>Date<br><input type="date" name="day" max="${dubaiDateKey(new Date())}" value="${hr.day}" style="width:100%"></label>
      <div style="grid-column:span 2" class="sub">${hr.busy ? "Working…" : !hr.uid || !hr.day ? "Pick an employee and date to see what's already recorded." :
        ex && ex.length ? `Existing entr${ex.length > 1 ? "ies" : "y"}: ${ex.map((c, n) => `<label><input type="radio" name="which" value="${n}" ${n ? "" : "checked"}> in ${t(c.clockInEvent?.dateTime)} · out ${t(c.clockOutEvent?.dateTime) || "<b>missing</b>"} · ${(c.breaks || []).length} break(s)</label>`).join(" &nbsp; ")} – saving will <b>update</b> it.`
        : "No entry recorded – saving will <b>create</b> one."}</div>
      <label>Clock-in<br><input type="time" name="inT" value="${pre.in}" style="width:100%"></label>
      <label>Clock-out<br><input type="time" name="outT" value="${pre.out}" style="width:100%"></label>
      <label>Add break start <span class="muted">(optional)</span><br><input type="time" name="bS" style="width:100%"></label>
      <label>Add break end<br><input type="time" name="bE" style="width:100%"></label>
      <label style="grid-column:span 3">Reason / approval reference<br><input name="reason" placeholder="e.g. Approved request 18 Nov – forgot to clock in, started 09:00" style="width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px"></label>
      <button class="primary" ${hr.busy ? "disabled" : ""}>Save correction</button>
    </form>
    <h2 class="sec">Recent HR corrections</h2>
    ${recent.length ? `<table><thead><tr><th>Staff</th><th>Day</th><th>Details</th></tr></thead><tbody>${recent.map(a => a.issues.filter(i => i.by === "hr").map(i =>
      `<tr><td>${esc(a.name)}</td><td class="num">${fmtDay(a.day)}</td><td>${esc(i.detail)}</td></tr>`).join("")).join("")}</tbody></table>`
      : '<p class="muted">None in the last 30 days.</p>'}`;
  const f = el.querySelector("#hrForm");
  const fu = f.elements.namedItem("uid"), fd = f.elements.namedItem("day");
  fu.onchange = () => { hr.uid = fu.value; loadExisting(); };
  fd.onchange = () => { hr.day = fd.value; loadExisting(); };
  f.onsubmit = ev => { ev.preventDefault(); saveCorrection(f); };
}

/* ===== VIEWS ===== */
function showView() {
  const v = location.hash === "#analytics" ? "analytics" : location.hash === "#hr" ? "hr" : "live";
  document.getElementById("app").hidden = v !== "live";
  document.getElementById("an").hidden = v !== "analytics";
  document.getElementById("hr").hidden = v !== "hr";
  document.getElementById("tabLive").className = v === "live" ? "on" : "";
  document.getElementById("tabAn").className = v === "analytics" ? "on" : "";
  document.getElementById("tabHr").className = v === "hr" ? "on" : "";
  document.getElementById("tabHr").hidden = !isHR();
  if (v === "analytics" && !an.data && !an.loading) loadAnalytics();
  if (v === "hr") renderHR();
}
window.addEventListener("hashchange", () => started && showView());

/* ===== LOOP ===== */
let started = false;
async function refresh() {
  try { await loadData(); state.error = null; }
  catch (e) {
    if (e.message === "not-signed-in") return showSignIn();
    state.error = e.status === 403
      ? "Access denied reading Shifts time cards. Make sure you are an owner of the 'Avaibe – Attendance' team and that admin consent was granted for Schedule.Read.All."
      : "Couldn't refresh: " + e.message;
  }
  render();
}
function start() {
  if (started) return; started = true;
  document.getElementById("refreshBtn").hidden = false;
  document.getElementById("signOutBtn").hidden = false;
  const acc = pca.getActiveAccount();
  document.getElementById("sub").textContent = "Shifts time clock · Dubai time · " + (acc?.username || "");
  document.getElementById("tabs").hidden = false;
  document.getElementById("app").innerHTML = '<div class="center"><p class="muted">Loading…</p></div>';
  showView();
  refresh();
  setInterval(refresh, CONFIG.refreshSec * 1000);
  setInterval(() => state.fetchedAt && render(), 1000);
}
function showSignIn() {
  document.getElementById("app").innerHTML = document.getElementById("app").innerHTML.includes("signInBtn") ? document.getElementById("app").innerHTML :
    '<div class="center"><p>Sign in with your Avaibe Microsoft account.</p><button class="primary" id="signInBtn">Sign in with Microsoft</button></div>';
  document.getElementById("signInBtn").onclick = () => signIn().catch(e => alertBox(e));
}
function alertBox(e){ const a=document.getElementById("app"); a.insertAdjacentHTML("afterbegin", `<div class="err">${esc(e.message||e)}</div>`); }

document.getElementById("refreshBtn").onclick = () => location.hash === "#analytics" ? loadAnalytics() : refresh();
document.getElementById("signOutBtn").onclick = () => inIframe ? pca.logoutPopup() : pca.logoutRedirect();

(async () => {
  try {
    await pca.initialize();
    const r = await pca.handleRedirectPromise();
    if (r?.account) pca.setActiveAccount(r.account);
    if (pca.getAllAccounts().length) start(); else showSignIn();
  } catch (e) { showSignIn(); alertBox(e); }
})();
</script>
