name: One-time - External sender tag in Outlook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enable External tag and check mailbox forwarding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module ExchangeOnlineManagement -Scope CurrentUser -Force
          Import-Module ExchangeOnlineManagement
          Write-Host ">>> Sign in with the device code below (as abhilash@avaibe.com)"
          Connect-ExchangeOnline -Device -ShowBanner:$false

          Write-Host '--- Before'
          Get-ExternalInOutlook | Format-List Enabled,AllowList | Out-String | Write-Host
          Set-ExternalInOutlook -Enabled $true
          Write-Host '--- After'
          Get-ExternalInOutlook | Format-List Enabled,AllowList | Out-String | Write-Host

          Write-Host '--- Mailbox-level forwarding (read-only check)'
          $fw = Get-Mailbox -ResultSize Unlimited | Where-Object { $_.ForwardingSmtpAddress -or $_.ForwardingAddress } |
                Select-Object DisplayName,PrimarySmtpAddress,ForwardingSmtpAddress,ForwardingAddress,DeliverToMailboxAndForward
          if ($fw) { $fw | Format-Table -AutoSize | Out-String -Width 200 | Write-Host } else { Write-Host 'No mailbox has forwarding set.' }

          Write-Host '--- Mailbox types'
          Get-Mailbox -ResultSize Unlimited | Select-Object DisplayName,PrimarySmtpAddress,RecipientTypeDetails |
            Format-Table -AutoSize | Out-String -Width 200 | Write-Host

          Disconnect-ExchangeOnline -Confirm:$false
